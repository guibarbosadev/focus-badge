<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FocusBadge</title>
    <link rel="stylesheet" href="../ui.css" />
    <style>.card { max-width: 520px; margin: 32px auto; }</style>
  </head>
  <body>
    <main class="card">
      <h1>FocusBadge</h1>

      <section id="signedOut" hidden>
        <p>Sign in from the FocusBadge toolbar button to start a session.</p>
      </section>

      <form id="createForm" hidden>
        <p>
          Once a session starts, you can add sites but not remove them.
          Removing a site stains your public badge.
        </p>
        <label for="name">Name (shown on your badge)</label>
        <input id="name" maxlength="100" placeholder="Deep work week" />
        <label for="sites">Sites to block, one per line</label>
        <textarea id="sites" rows="6" required placeholder="youtube.com&#10;twitter.com"></textarea>
        <label for="endDate">Ends (optional)</label>
        <input id="endDate" type="datetime-local" />
        <button type="submit" class="primary">Start session</button>
      </form>

      <section id="running" hidden>
        <h2 id="sessionName"></h2>
        <p>Blocked sites (additions only):</p>
        <ul id="siteList"></ul>
        <form id="addForm" class="row">
          <input id="newSite" aria-label="Site to add" placeholder="reddit.com" required />
          <button type="submit" class="primary">Add</button>
        </form>
      </section>

      <div id="message" class="status" role="status"></div>
    </main>
    <script src="../config.js"></script>
    <script src="../lib.js"></script>
    <script src="options.js"></script>
  </body>
</html>
