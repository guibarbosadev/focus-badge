<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FocusBadge</title>
    <link rel="stylesheet" href="../ui.css" />
    <style>body { width: 320px; }</style>
  </head>
  <body>
    <div class="card">
      <h1>FocusBadge</h1>

      <section id="signedOut" hidden>
        <p>Sign in to start a focus session and publish your badge.</p>
        <button id="login" class="primary">Continue with Google</button>
      </section>

      <section id="idle" hidden>
        <p id="lastResult">No session running.</p>
        <button id="start" class="primary">Start a focus session</button>
      </section>

      <section id="running" hidden>
        <h2 id="sessionName"></h2>
        <span id="sessionStatus" class="pill"></span>
        <p id="sessionInfo" class="status"></p>
        <button id="copyBadge" class="primary">Copy badge link</button>
        <button id="openBadge">Open badge</button>
        <button id="manage">Add sites</button>
        <button id="end" class="danger">End session early</button>
      </section>

      <button id="logout" hidden>Sign out</button>
      <div id="message" class="status" role="status"></div>
    </div>
    <script src="../config.js"></script>
    <script src="../lib.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
